services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zeta-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-zeta_auth_bot}
      - API_URL=${API_URL:-http://localhost:8000}
