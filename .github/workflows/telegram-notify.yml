name: Telegram notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, closed]

jobs:
  notify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this push is a PR merge into main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # мердж PR в main тоже триггерит push — чтобы не дублировать алерт
          # с notify-pr-merged, проверяем, связан ли коммит со смерженным PR
          ASSOCIATED=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}/pulls")

          IS_PR_MERGE=$(echo "$ASSOCIATED" | jq -r 'map(select(.merged_at != null)) | length > 0')
          echo "is_pr_merge=${IS_PR_MERGE}" >> "$GITHUB_OUTPUT"

      - name: Send push notification
        if: steps.check.outputs.is_pr_merge != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")
          SHORT_SHA="${COMMIT_SHA:0:7}"
          # только первая строка сообщения коммита, без тела
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MSG" | head -n1)

          # сообщение уходит с parse_mode=HTML — экранируем динамические поля
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          # GitHub-логин -> имя участника и ник-ссылка на профиль; неизвестный логин — просто ссылка
          who() {
            link="<a href=\"https://github.com/$1\">$1</a>"
            case "$1" in
              Ivansups) echo "Климов Иван ($link)" ;;
              JustAlek24) echo "Берестнев Алексей ($link)" ;;
              DLqwerty) echo "Ульянченко Даниил ($link)" ;;
              LLlk0lnik) echo "Шелудько Данил ($link)" ;;
              Nikita-RemezovOA) echo "Ремезов Никита ($link)" ;;
              *) echo "$link" ;;
            esac
          }
          ACTOR=$(who "$ACTOR")
          REPO_NAME=$(esc "$REPO_NAME"); BRANCH=$(esc "$BRANCH"); COMMIT_TITLE=$(esc "$COMMIT_TITLE")

          TEXT=$(printf '🔔 Push в main\n──────────\n\nРепозиторий: %s\n\nВетка: %s\n\nАвтор: %s\n\nКоммит: %s — "%s"\n\n🕒 %s' \
            "$REPO_NAME" "$BRANCH" "$ACTOR" "$SHORT_SHA" "$COMMIT_TITLE" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            --data-urlencode parse_mode=HTML \
            --data-urlencode disable_web_page_preview=true

  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Send PR opened notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")

          # сообщение уходит с parse_mode=HTML — экранируем динамические поля
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          # GitHub-логин -> имя участника и ник-ссылка на профиль; неизвестный логин — просто ссылка
          who() {
            link="<a href=\"https://github.com/$1\">$1</a>"
            case "$1" in
              Ivansups) echo "Климов Иван ($link)" ;;
              JustAlek24) echo "Берестнев Алексей ($link)" ;;
              DLqwerty) echo "Ульянченко Даниил ($link)" ;;
              LLlk0lnik) echo "Шелудько Данил ($link)" ;;
              Nikita-RemezovOA) echo "Ремезов Никита ($link)" ;;
              *) echo "$link" ;;
            esac
          }
          PR_AUTHOR=$(who "$PR_AUTHOR")
          REPO_NAME=$(esc "$REPO_NAME"); HEAD_BRANCH=$(esc "$HEAD_BRANCH"); BASE_BRANCH=$(esc "$BASE_BRANCH"); PR_TITLE=$(esc "$PR_TITLE")

          TEXT=$(printf '🚀 Открыт PR в main\n──────────\n\nРепозиторий: %s\n\nВетка: %s → %s\n\nАвтор: %s\n\nPR: #%s — "%s"\n\n🕒 %s' \
            "$REPO_NAME" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_AUTHOR" "$PR_NUMBER" "$PR_TITLE" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            --data-urlencode parse_mode=HTML \
            --data-urlencode disable_web_page_preview=true

  notify-pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send PR merged notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")
          SHORT_SHA="${MERGE_SHA:0:7}"

          # сообщение уходит с parse_mode=HTML — экранируем динамические поля
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          # GitHub-логин -> имя участника и ник-ссылка на профиль; неизвестный логин — просто ссылка
          who() {
            link="<a href=\"https://github.com/$1\">$1</a>"
            case "$1" in
              Ivansups) echo "Климов Иван ($link)" ;;
              JustAlek24) echo "Берестнев Алексей ($link)" ;;
              DLqwerty) echo "Ульянченко Даниил ($link)" ;;
              LLlk0lnik) echo "Шелудько Данил ($link)" ;;
              Nikita-RemezovOA) echo "Ремезов Никита ($link)" ;;
              *) echo "$link" ;;
            esac
          }
          MERGED_BY=$(who "$MERGED_BY")
          REPO_NAME=$(esc "$REPO_NAME"); HEAD_BRANCH=$(esc "$HEAD_BRANCH"); BASE_BRANCH=$(esc "$BASE_BRANCH"); PR_TITLE=$(esc "$PR_TITLE")

          TEXT=$(printf '✅ Merge в main\n──────────\n\nРепозиторий: %s\n\nВетка: %s → %s\n\nСмержил: %s\n\nPR: #%s — "%s"\n\nКоммит: %s\n\n🕒 %s' \
            "$REPO_NAME" "$HEAD_BRANCH" "$BASE_BRANCH" "$MERGED_BY" "$PR_NUMBER" "$PR_TITLE" "$SHORT_SHA" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}" \
            --data-urlencode parse_mode=HTML \
            --data-urlencode disable_web_page_preview=true
