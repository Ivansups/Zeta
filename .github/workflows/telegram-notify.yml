name: Telegram notifications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, closed]

jobs:
  notify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")
          SHORT_SHA="${COMMIT_SHA:0:7}"
          # только первая строка сообщения коммита, без тела
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MSG" | head -n1)

          TEXT=$(printf '🔔 Push в main\nРепозиторий: %s\nВетка: %s\nАвтор: %s (@%s)\nКоммит: %s — "%s"\nВремя: %s' \
            "$REPO_NAME" "$BRANCH" "$COMMIT_AUTHOR" "$ACTOR" "$SHORT_SHA" "$COMMIT_TITLE" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

  notify-pr-opened:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Send PR opened notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")

          TEXT=$(printf '🔔 Открыт PR в main\nРепозиторий: %s\nВетка: %s → %s\nАвтор: %s\nPR: #%s — "%s"\nВремя: %s' \
            "$REPO_NAME" "$HEAD_BRANCH" "$BASE_BRANCH" "$PR_AUTHOR" "$PR_NUMBER" "$PR_TITLE" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"

  notify-pr-merged:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Send PR merged notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_NAME: ${{ github.event.repository.name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TIME=$(TZ='Europe/Moscow' date +"%Y-%m-%d %H:%M MSK")
          SHORT_SHA="${MERGE_SHA:0:7}"

          TEXT=$(printf '✅ Merge в main\nРепозиторий: %s\nВетка: %s → %s\nСмержил: %s\nPR: #%s — "%s"\nКоммит: %s\nВремя: %s' \
            "$REPO_NAME" "$HEAD_BRANCH" "$BASE_BRANCH" "$MERGED_BY" "$PR_NUMBER" "$PR_TITLE" "$SHORT_SHA" "$TIME")

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${TEXT}"
